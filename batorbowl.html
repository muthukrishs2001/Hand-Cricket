<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Cricket - Choose Bat or Bowl</title>
    <link rel="stylesheet" href="./index.css" type="text/css" />
</head>

<body>
    <main class="bat-or-bowl-overall">
        <div class="container1">
        <span class="badge">YOU WON THE TOSS!</span>
        <h1 class="title1">Choose Your Play</h1>
        <p class="subtitle1">What would you like to do first?</p>

        <div class="choice-cards">
            <div class="card" id="batChoice">
                <div class="icon">🏏</div>
                <h2>BATTING</h2>
                <p>Set a massive target on the board</p>
            </div>

            <div class="card" id="bowlChoice">
                <div class="icon">🥎</div>
                <h2>BOWLING</h2>
                <p>Restrict the computer early</p>
            </div>
        </div>
    </div>
    </main>
    <script src="./index.js"></script>
</body>

</html>
