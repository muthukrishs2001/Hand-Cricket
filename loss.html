<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Cricket - Defeat</title>
    <link rel="stylesheet" href="./index.css" type="text/css" />
</head>

<body>
    <main class="loss-overall">
        <div class="result-card1 loss-card1">
        <div class="emoji1">💔</div>
        <h1 class="status-title1">YOU LOST!</h1>
        <p class="status-desc1">Tough luck! The computer outplayed your squad this time. Ready for a rematch?</p>

        <div class="summary-box1">
            <div class="stat1">
                <span>YOUR SCORE</span>
                <strong id="finalYourScore">0</strong>
            </div>
            <div class="stat1">
                <span>COMPUTER SCORE</span>
                <strong id="finalCompScore">0</strong>
            </div>
        </div>

        <button class="again-btn1" id="playAgainLoss">TRY AGAIN</button>
    </div>
    </main>
    <script src="./index.js"></script>
</body>

</html>
