<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Cricket - Team Lineup</title>
    <link rel="stylesheet" href="./index.css" type="text/css" />
</head>

<body>
    <main class="player-overall">
        <div class="container2">
        <h1 class="title2">PLAYING V LINEUP</h1>
        <p class="subtitle2">Enter your 5 squad members</p>

        <div class="player-form" id="playerForm">
            <div class="input-group">
                <label for="p1">Player 1 (Captain)</label>
                <input type="text" id="p1" placeholder="Enter Player 1 Name" required>
            </div>

            <div class="input-group">
                <label for="p2">Player 2</label>
                <input type="text" id="p2" placeholder="Enter Player 2 Name" required>
            </div>

            <div class="input-group">
                <label for="p3">Player 3</label>
                <input type="text" id="p3" placeholder="Enter Player 3 Name" required>
            </div>

            <div class="input-group">
                <label for="p4">Player 4</label>
                <input type="text" id="p4" placeholder="Enter Player 4 Name" required>
            </div>

            <div class="input-group">
                <label for="p5">Player 5</label>
                <input type="text" id="p5" placeholder="Enter Player 5 Name" required>
            </div>

            <button id="btn" class="start-btn">START MATCH →</button>
        </div>
    </div>
    </main>
    <script src="./index.js"></script>
</body>

</html>
