<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Cricket - Victory!</title>
    <link rel="stylesheet" href="./index.css" type="text/css" />
</head>

<body>
    <main class="win-overall">
        <div class="result-card win-card">
        <div class="trophy">🏆</div>
        <h1 class="status-title">VICTORY!</h1>
        <p class="status-desc">What a match! Your squad crushed the target and took home the trophy.</p>

        <div class="summary-box">
            <div class="stat">
                <span>YOUR SCORE</span>
                <strong id="finalYourScore">0</strong>
            </div>
            <div class="stat">
                <span>COMPUTER SCORE</span>
                <strong id="finalCompScore">0</strong>
            </div>
        </div>

        <button class="again-btn" id="playAgainWin">PLAY AGAIN</button>
    </div>
    </main>
    <script src="./index.js"></script>
</body>

</html>
